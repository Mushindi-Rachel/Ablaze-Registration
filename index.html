<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e25909" />
    <title>Youth Ablaze 2026 | Registration</title>
    <meta name="description" content="Register for Youth Ablaze 2026 — a conference of faith, growth and fellowship." />

    <!-- Link preview (WhatsApp, Facebook, etc.). WhatsApp needs ABSOLUTE urls here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Youth Ablaze 2026" />
    <meta property="og:title" content="Youth Ablaze ’26 Conference | Register now" />
    <meta property="og:description" content="14–18 December 2026, Kisumu. #Know the God of your Father — 1 Chronicles 28:9" />
    <meta property="og:url" content="https://mushindi-rachel.github.io/Ablaze-Registration/" />
    <meta property="og:image" content="https://mushindi-rachel.github.io/Ablaze-Registration/images/og-ticket.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="images/WhatsApp_Image_2025-08-13_at_15.45.58-removebg-preview.png" />
    <link rel="stylesheet" href="Styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
</head>

<body>
    <main class="container">
        <header class="intro">
            <img src="images/WhatsApp_Image_2025-08-13_at_15.45.58-removebg-preview.png" alt="Youth Ablaze logo" class="logo" width="140" height="140" />
            <h1>Youth Ablaze 2026 Registration</h1>
            <p class="lead">Join us for an unforgettable experience of faith, growth and fellowship.</p>
            <p class="theme">#Know the God of your Father<br /><span>1 Chronicles 28:9</span></p>
        </header>

        <form id="registrationForm" novalidate>
            <!-- Personal Info -->
            <fieldset class="section">
                <legend>Personal Info</legend>

                <div class="field">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" autocomplete="name" required />
                </div>

                <div class="field">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="e.g. 0712345678" required />
                </div>

                <div class="row">
                    <div class="field">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age" inputmode="numeric" min="5" max="99" required />
                    </div>
                    <div class="field">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select…</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <!-- Church Info -->
            <fieldset class="section">
                <legend>Church Info</legend>

                <div class="field">
                    <label for="church">Name of your church</label>
                    <input type="text" id="church" name="church" autocomplete="organization" required />
                </div>

                <div class="field">
                    <label for="pastorname">Pastor's name <span class="optional">(optional)</span></label>
                    <input type="text" id="pastorname" name="pastorname" />
                </div>

                <div class="field">
                    <label for="pastornumber">Pastor's phone number <span class="optional">(optional)</span></label>
                    <input type="tel" id="pastornumber" name="pastornumber" inputmode="tel" placeholder="e.g. 0712345678" />
                </div>
            </fieldset>

            <!-- Accommodation -->
            <fieldset class="section">
                <legend>Accommodation</legend>

                <div class="field">
                    <label for="accommodation">Will you be a boarder or a day scholar?</label>
                    <select id="accommodation" name="accommodation" required>
                        <option value="">Select…</option>
                        <option value="boarder">Boarder</option>
                        <option value="dayscholar">Day Scholar</option>
                    </select>
                </div>

                <!-- Payment (boarders only) -->
                <div id="payment-section" hidden>
                    <div class="field">
                        <label for="payment-method">Payment method</label>
                        <select id="payment-method" name="payment_method">
                            <option value="">Select…</option>
                            <option value="mpesa">M-Pesa</option>
                            <option value="cash">Cash</option>
                        </select>
                    </div>

                    <div class="field" id="receipt-field" hidden>
                        <label for="receipt_no">Receipt number</label>
                        <input type="text" id="receipt_no" name="receipt_no" placeholder="Enter receipt number" autocomplete="off" />
                    </div>

                    <div class="field" id="mpesa-field" hidden>
                        <label for="mpesa-code">M-Pesa transaction code</label>
                        <input type="text" id="mpesa-code" name="mpesa_code" placeholder="e.g. SJK4XXXXXX" maxlength="10" autocomplete="off" autocapitalize="characters" />
                    </div>
                </div>
            </fieldset>

            <!-- Health -->
            <fieldset class="section">
                <legend>Health</legend>
                <div class="field">
                    <label for="allergy">Allergies <span class="optional">(write "None" if not applicable)</span></label>
                    <input type="text" id="allergy" name="allergy" placeholder="None" />
                </div>
            </fieldset>

            <!-- Emergency -->
            <fieldset class="section">
                <legend>Emergency Contact</legend>

                <div class="field">
                    <label for="Ename">Contact name</label>
                    <input type="text" id="Ename" name="Ename" required />
                </div>

                <div class="field">
                    <label for="Ephone">Contact phone number</label>
                    <input type="tel" id="Ephone" name="Ephone" inputmode="tel" placeholder="e.g. 0712345678" required />
                </div>
            </fieldset>

            <!-- Honeypot: hidden from people, bots tend to fill it in -->
            <div class="hp" aria-hidden="true">
                <label for="website">Leave this field empty</label>
                <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
            </div>

            <button type="submit" id="submitBtn">Register Now</button>
            <p class="fineprint">Fields marked required must be filled before you can submit.</p>
        </form>
    </main>

    <script src="ticket.js" defer></script>
    <script src="functions.js" defer></script>
</body>

</html>
